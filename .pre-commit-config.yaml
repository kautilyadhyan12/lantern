repos:
  - repo: local
    hooks:
      - {id: end-of-file-fixer, name: End of file, entry: uv run end-of-file-fixer, language: system, types: [text]}
      - {id: trailing-whitespace-fixer, name: Trailing whitespace, entry: uv run trailing-whitespace-fixer, language: system, types: [text]}
      - {id: ruff, name: Ruff, entry: uv run ruff check --fix, language: system, types: [python]}
      - {id: ruff-format, name: Ruff format, entry: uv run ruff format, language: system, types: [python]}
      - {id: mypy, name: Strict types, entry: uv run mypy --strict, language: system, pass_filenames: false, types: [python]}
      - {id: detect-secrets, name: Secret scan, entry: uv run detect-secrets-hook --no-verify --baseline .secrets.baseline, language: system, exclude: ^uv\.lock$}
