[project]
name = "lantern"
version = "0.1.0"
description = "AI-orchestrated OSINT investigation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
]

[project.scripts]
lantern = "lantern.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "detect-secrets>=1.5.0",
    "diff-cover>=10.5.1",
    "hypothesis>=6.168.0",
    "mutmut>=3.8.0",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.7",
    "types-pyyaml>=6.0.12.20260906",
]

# Tool configuration below is guarded by tests/unit/test_pyproject_config.py.
# Do not widen ignores or lower thresholds.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "EM", "ISC", "PIE", "PT",
    "RET", "SIM", "TID", "ARG", "PL", "RUF", "S", "BLE", "TRY", "ASYNC",
]
ignore = ["PLR2004", "TRY003", "EM101", "EM102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR", "ARG"]
# Adversarial tests carry hostile text (RTL marks, non-breaking spaces) as their subject matter.
"tests/review/**" = ["PLE2502", "RUF001", "RUF003"]

[tool.mypy]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers -p no:cacheprovider --import-mode=importlib"
pythonpath = ["."]
markers = ["ac(id): acceptance criterion id", "live: hits real APIs", "slow"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["src/lantern"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mutmut]
paths_to_mutate = ["src/lantern/"]
tests_dir = ["tests/"]
