[project]
name = "lantern"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "sqlalchemy[asyncio]==2.1.4",
]

[project.scripts]
lantern = "lantern.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lantern"]

[tool.uv]
exclude-newer = false
constraint-dependencies = ["certifi>=2026.10.19", "virtualenv>=21.14.13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","W","I","N","UP","B","A","C4","DTZ","T10","EM","ISC","PIE","PT","RET","SIM","TID","ARG","PL","RUF","S","BLE","TRY","ASYNC"]
ignore = ["PLR2004","TRY003","EM101","EM102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101","PLR","ARG"]
"tests/review/**" = ["S101","PLR","ARG","N999"]

[tool.mypy]
files = ["src", "scripts"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -p no:cacheprovider --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "ac(id): acceptance criterion id",
  "review: adversarial test written by the independent reviewer",
  "live: calls real external APIs",
  "slow: slow test",
]

[tool.coverage.run]
branch = true
source = ["src/lantern", "scripts"]
patch = ["subprocess"]

[tool.importlinter]
root_package = "lantern"

[[tool.importlinter.contracts]]
name = "CLI depends on database, never the reverse"
type = "layers"
layers = ["lantern.cli", "lantern.db"]

[tool.lantern.quality]
coverage_total = 85
coverage_critical = 95
critical_paths = [
    "src/lantern/core", "src/lantern/policy", "src/lantern/egress",
    "src/lantern/db/events.py", "src/lantern/tools/gateway.py", "src/lantern/llm/gateway.py",
    "src/lantern/report/render_html.py", "scripts/hooks",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "coverage==7.17.0",
    "detect-secrets==1.5.0",
    "hatchling==1.32.4",
    "hypothesis==6.169.4",
    "import-linter==2.15",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "pre-commit-hooks==6.0.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.1",
    "ruff==0.17.0",
]
